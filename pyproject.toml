[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhm-rapids"
version = "0.1.0"
description = "Reusable RAPIDS adoption module for MHM pipelines"
requires-python = ">=3.10"
dependencies = [
  "PyYAML==6.0.2",
  "pandas==2.3.3",
  "mhm-pipelines @ git+https://github.com/MentalHealthMission/MHM-data-pipelines.git@c4886ca1e5a2a7da9bfe664b623cd3b5995f94fe",
]

[tool.setuptools.packages.find]
include = [
  "mhm_core.rapids*",
]
namespaces = true
